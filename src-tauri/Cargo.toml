[package]
name = "winbook"
version = "0.1.0"
description = "winbook —— Windows 11 桌面应用（Tauri 2 + React + SQLite）"
authors = ["winbook"]
edition = "2021"
rust-version = "1.77"

# 库与可执行分离：Windows 上 main.rs 只负责调用 run()，
# 真正的组装写在 lib.rs —— 这样将来加集成测试（tests/ 目录）时
# 可以直接 use winbook_lib::... 而不必把整个应用启起来。
[lib]
name = "winbook_lib"
# 只要 rlib。Tauri 官方模板默认写成
# `["staticlib", "cdylib", "rlib"]`，那三个是为移动端准备的
# （iOS 链 staticlib、Android 链 cdylib）。本项目只出 Windows 桌面版，
# 留着会让每次构建多产出两份用不上的产物。
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
# 见文件末尾「伪依赖」那段注释：indexmap 的 std 特性必须在**两个图**里各开一次。
# tauri-build（构建依赖）→ tauri-utils → schemars → indexmap 1.9.3，
# 而 resolver v2 下构建图的特性与普通依赖图**不共享**。
indexmap = { version = "1.9", features = ["std"] }

[dependencies]
tauri = { version = "2", features = [] }
# 插件只留真正用到的两个，都只从 Rust 侧调用（前端不碰插件 IPC）：
#   dialog —— 导出与备份时弹系统保存对话框（`DialogExt`）。
# 曾经还注册过 fs 与 opener，但全项目零调用（前端只用 invoke 走自己的命令），
# 已连同 capabilities 里的对应权限一起删除。
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# bundled：把 SQLite 的 C 源码一起编进产物，用户机器上不需要任何外部 sqlite3.dll。
# 依赖树里只有这一个 SQLite：不必操心 ABI、预编译产物，也不需要外部 DLL。
#
# backup：打开 `rusqlite::Backup` / `Connection::backup`（在线备份 API）。
# 备份**不能**用「复制 .db 文件」代替：库跑在 WAL 模式下，最后一次自动保存
# 很可能还压在 -wal 边档里，复制主文件会静默少掉最后一章。
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
# 时间：`chrono` 负责日期运算与时区转换。
# 注意这里**没有** `thiserror` / `log` / `uuid` —— 它们是从旧壳的实现里
# 顺带继承下来的候选依赖，但本项目一个都没用上：
#   错误类型是手写的 `AppError`（见 `core/errors.rs`），没用 derive；
#   日志是自研的 JSON 行日志（见 `core/logger.rs`），没接 `log` 门面；
#   请求 ID 是「时间戳 + 进程内计数器」（见 `core/request_id.rs`），不需要 uuid。
chrono = { version = "0.4", features = ["clock", "serde"] }
regex = "1"
once_cell = "1"

# ── 一条不得已的「伪依赖」──────────────────────────────────────────────
# 我们并不直接使用 indexmap，写在这里纯粹是为了**打开它的 std 特性**。
#
# 根因：tauri → tauri-utils → schemars 0.8 → indexmap 1.9.3。
# indexmap 1.9.3 的 map.rs 里是这样定义的：
#     #[cfg(has_std)]        pub struct IndexMap<K, V, S = RandomState> { .. }
#     #[cfg(not(has_std))]   pub struct IndexMap<K, V, S>             { .. }
# 也就是说 **std 特性没开时，第三个泛型参数没有默认值**。而 schemars 里
# 写的是 `pub type Map<K, V> = indexmap::IndexMap<K, V>;` —— 于是它编译失败：
#     error[E0107]: struct takes 3 generic arguments but 2 were supplied
# 这不是我们的代码问题，也不是 schemars 的 bug，而是**依赖图里恰好没有
# 任何 crate 打开 indexmap/std**（schemars 只开了 serde-1）。常规 Tauri 工程
# 里往往有别的依赖顺手把它打开，所以这个坑不常见。
#
# cargo 的特性是并集合并的，因此在根上声明一份带 std 的 indexmap 1.9，
# 即可让整张依赖图都看到 `has_std`。等上游把 schemars 换到 indexmap 2
# （或者有人打开了这个特性）就可以删掉这一行。
indexmap = { version = "1.9", features = ["std"] }

[features]
# 透传给 tauri 的同名特性。
#
# 为什么必须显式声明：`WebviewWindow::open_devtools` 在 tauri 里的门控条件是
#     #[cfg(any(debug_assertions, feature = "devtools"))]
# 我们为了与它逐字对齐，在 lib.rs 里也写了同样的条件。但本 crate 若没有在这里
# 声明该特性，rustc 会把它当成**未知的 cfg 值**并报警：
#     warning: unexpected `cfg` condition value: `devtools`
# 声明之后既消掉告警，也让「release 版要不要保留开发者工具」变成显式可选项：
#     cargo build --release --features devtools
devtools = ["tauri/devtools"]

[profile.release]
# 体积优化的四项：一次性的 codegen-unit、全量 LTO、按体积而非速度优化、
# 剥掉符号。代价是编译慢（本项目可接受，发布才跑）。
# panic = "abort" 让编译器省掉 unwind 表，但会让 catch_unwind 失效 ——
# 本项目不依赖它，命令边界靠 Result 而非 panic 传递错误。
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
